services:

  # ─── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: onflow-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.route-prefix=/"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  # ─── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: onflow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: onflow2024
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/monitor"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ─── Node Exporter (host metrics) ────────────────────────────────────────
  # Note: trên macOS Docker Desktop, metrics phản ánh Linux VM bên trong Docker
  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: onflow-node-exporter
    restart: unless-stopped
    command:
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|run)($$|/)"
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.meminfo"
      - "--collector.filesystem"
      - "--collector.netdev"
      - "--collector.loadavg"
      - "--collector.uname"
    ports:
      - "9100:9100"
    networks:
      - monitoring

  # ─── cAdvisor (Docker container metrics) ─────────────────────────────────
  # Note: macOS không hỗ trợ rslave/shared mount propagation
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: onflow-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"
    networks:
      - monitoring

  # ─── Blackbox Exporter (probe HTTP/gRPC endpoints) ───────────────────────
  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: onflow-blackbox
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "9115:9115"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  # ─── OpenTelemetry Collector ──────────────────────────────────────────────
  # Nhận OTLP traces/metrics từ tms-core (OPENTELEMETRY_ENDPOINT=<host>:4317)
  # Re-export: traces → Jaeger (nếu có), metrics → Prometheus scrape :8889
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: onflow-otel-collector
    restart: unless-stopped
    volumes:
      - ./otel/otel-collector-config.yml:/config.yml:ro
    command: --config config.yml
    ports:
      - "4317:4317"   # OTLP gRPC – tms-core gửi traces/metrics vào đây
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (Prometheus scrape tại /metrics)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  # ─── Jaeger (Distributed Tracing) ─────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: onflow-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4319:4317"   # OTLP gRPC (để không đụng port 4317 của OTel Collector trên host)
    networks:
      - monitoring

  # ─── PostgreSQL Exporter (DB Metrics) ────────────────────────────────────
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: onflow-postgres-exporter
    restart: unless-stopped
    environment:
      # Lấy thông tin DB_HOST, PORT, USER, PASS, DB_NAME từ tms-core
      - DATA_SOURCE_NAME=postgresql://app:app_password@host.docker.internal:6432/app?sslmode=disable
    ports:
      - "9187:9187"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    name: onflow-monitoring
