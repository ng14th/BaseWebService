global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "onflow"

rule_files:
  - "/etc/prometheus/rules/*.yml"

# ─── Alertmanager (optional, có thể bỏ comment khi cần) ──────────────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:

  # ── Prometheus tự monitor ──────────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Node Exporter – Host metrics (CPU, RAM, disk, network) ─────────────────
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "onflow-host"

  # ── cAdvisor – Docker container metrics ────────────────────────────────────
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service

  # ── Blackbox: HTTP probe – port 8888 (TMS API) ────────────────────────────
  - job_name: "blackbox_http_8888"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://host.docker.internal:8888/api/v1/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox_exporter:9115"
      - target_label: service
        replacement: "tms-8888"

  # ── Blackbox: HTTP probe – port 50010 ─────────────────────────────────────
  - job_name: "blackbox_http_50010"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://host.docker.internal:50010/health"
          - "http://host.docker.internal:50010/"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox_exporter:9115"
      - target_label: service
        replacement: "service-50010"

  # ── Blackbox: HTTP probe – port 50020 ─────────────────────────────────────
  - job_name: "blackbox_http_50020"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://host.docker.internal:50020/health"
          - "http://host.docker.internal:50020/"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox_exporter:9115"
      - target_label: service
        replacement: "service-50020"

  # ── Blackbox: TCP probe – port 50010 & 50020 (gRPC ports) ─────────────────
  - job_name: "blackbox_tcp_grpc"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - "host.docker.internal:50010"
          - "host.docker.internal:50020"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox_exporter:9115"

  # ── tms-api – FastAPI metrics (:8888) ────────────────────────────────────
  - job_name: "tms-api"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "host.docker.internal:8888"
        labels:
          service: "tms-api"
    metrics_path: /metrics

  # ── PostgreSQL Exporter (:9187) ──────────────────────────────────────────
  - job_name: "postgres-exporter"
    static_configs:
      - targets:
          - "postgres_exporter:9187"
        labels:
          service: "postgres"
    metrics_path: /metrics

  # ── e-invoice – FastAPI metrics (:8089) ──────────────────────────────────
  - job_name: "e-invoice"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "host.docker.internal:8089"
        labels:
          service: "e-invoice"
    metrics_path: /metrics
