apiVersion: 1

providers:
  - name: "Onflow Dashboards"
    orgId: 1
    folder: "Onflow"
    folderUid: "onflow"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
