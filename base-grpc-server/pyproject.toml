[project]
name = "my-app-grpc-server"
version = "0.1.0"
description = "my-app gRPC server template"
authors = [{name = "my-app"}]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "grpcio (>=1.80.0,<2.0.0)",
    "grpcio-tools (>=1.80.0,<2.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "opentelemetry-api (>=1.41.0,<2.0.0)",
    "opentelemetry-sdk (>=1.41.0,<2.0.0)",
    "opentelemetry-exporter-otlp (>=1.41.0,<2.0.0)",
    "opentelemetry-instrumentation-grpc (>=0.64b0,<0.65)",
]

[tool.poetry]
packages = [{include = "app"}, {include = "core"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^1.4.0"
pytest-cov = "^6.2.1"
pytest-html = "^4.1.1"
pre-commit = "^4.6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
