exclude: "(^tests/|/tests/|^app/rpc/generated/|/app/rpc/generated/)"

repos:
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8

  - repo: local
    hooks:
      - id: unit-test-coverage-gate
        name: Unit test + coverage gate (>=100%)
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
