[project]
name = "my-app"
version = "0.1.0"
description = "my-app FastAPI service"
authors = [
    {name = "my-app"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "yarl (>=1.23.0,<2.0.0)",
    "fastapi (>=0.136.0,<0.137.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "gunicorn (>=25.3.0,<26.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "uvloop (>=0.22.1,<0.23.0)",
    "httptools (>=0.7.1,<0.8.0)",
    "opentelemetry-api (>=1.41.0,<2.0.0)",
    "opentelemetry-sdk (>=1.41.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.64b0,<0.65)",
    "opentelemetry-exporter-otlp (>=1.41.0,<2.0.0)",
    "prometheus-fastapi-instrumentator (>=7.1.0,<8.0.0)",
    "sentry-sdk (>=2.58.0,<3.0.0)",
    "ujson (>=5.12.0,<6.0.0)",
    "orjson (>=3.11.8,<4.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "alembic (>=1.17.0,<2.0.0)",
    "greenlet (>=3.2.4,<4.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "opentelemetry-instrumentation-celery (>=0.64b0,<0.65)",
    "grpcio (>=1.80.0,<2.0.0)",
    "grpcio-tools (>=1.80.0,<2.0.0)",
]

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^1.4.0"
pytest-cov = "^6.2.1"
pytest-html = "^4.1.1"
pre-commit = "^4.6.0"
pip-audit = "^2.9.0"
bandit = "^1.9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
